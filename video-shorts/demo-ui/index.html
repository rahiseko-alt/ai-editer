<!--
  撮影用の見た目デモ（2026-08-18 マスター指示）。
  裏では何も処理していません。すべてローカルの JS タイマーとダミーデータで画面が進みます。
  実際の編集（faster-whisper / ffmpeg）は src/ 配下の CLI をマスターの PC で直接叩く運用（B案）で行い、
  この画面はそれとは接続していません。「AI/Claude が動いている」ことを示す表記は一切出しません。
-->
<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI-Editer</title>
<style>
  :root{
    --bg:#0b0d12;
    --panel:#12151c;
    --panel-2:#171b24;
    --line:#242a36;
    --text:#e7eaf0;
    --text-dim:#8b93a3;
    --accent:#4f7cff;
    --accent-2:#7c5cff;
    --good:#39c98a;
    --cut:#3a4152;
    --warn:#e3b341;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:grid;
    grid-template-columns:220px 1fr 280px;
    grid-template-rows:56px 1fr;
    height:100vh;
  }
  header{
    grid-column:1/4;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#12151c,#0f1218);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.3px;}
  .brand .mark{
    width:24px;height:24px;border-radius:7px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:#fff;
  }
  .header-right{display:flex;align-items:center;gap:10px;}
  .btn{
    appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s;
  }
  .btn:hover{border-color:var(--accent);}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border:none;font-weight:600;
  }
  .btn.primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.ghost{background:transparent;}

  aside.left{
    border-right:1px solid var(--line);
    padding:16px 12px;
    overflow-y:auto;
    background:var(--panel);
  }
  .section-title{
    font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;
    margin:4px 6px 10px;
  }
  .drop{
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:18px 10px;
    text-align:center;
    font-size:12.5px;
    color:var(--text-dim);
    cursor:pointer;
    transition:.15s;
  }
  .drop.dragover{border-color:var(--accent);color:var(--text);background:rgba(79,124,255,.06);}
  .clip-list{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
  .clip-card{
    display:flex;gap:8px;align-items:center;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px;
    cursor:pointer;
  }
  .clip-card.active{border-color:var(--accent);}
  .clip-card canvas{width:52px;height:32px;border-radius:5px;background:#000;flex:none;}
  .clip-meta{overflow:hidden;}
  .clip-meta .name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .clip-meta .dur{font-size:11px;color:var(--text-dim);}

  main.center{
    display:flex;flex-direction:column;
    padding:18px 22px;
    overflow:hidden;
  }
  .stage{
    flex:1;
    display:flex;align-items:center;justify-content:center;
    background:#000;
    border-radius:12px;
    overflow:hidden;
    position:relative;
    min-height:0;
  }
  .stage.v-portrait{aspect-ratio:9/16;height:100%;width:auto;margin:0 auto;}
  .stage.v-landscape{aspect-ratio:16/9;width:100%;height:auto;}
  .stage video{width:100%;height:100%;object-fit:contain;background:#000;}
  .stage .empty{color:var(--text-dim);font-size:13px;text-align:center;padding:20px;}
  .stage .empty b{color:var(--text);display:block;font-size:14px;margin-bottom:6px;}

  .timeline-wrap{margin-top:14px;}
  .timeline-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .timeline-head .label{font-size:12px;color:var(--text-dim);}
  .timeline{
    height:34px;border-radius:8px;overflow:hidden;display:flex;background:var(--panel-2);
    border:1px solid var(--line);
  }
  .timeline .seg{height:100%;position:relative;transition:opacity .3s;}
  .timeline .seg.keep{background:linear-gradient(180deg,var(--good),#2aa373);}
  .timeline .seg.cut{background:var(--cut);}
  .timeline .seg + .seg{border-left:1px solid rgba(0,0,0,.25);}

  .instruction-bar{
    margin-top:14px;
    display:flex;gap:10px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px;
  }
  .instruction-bar input{
    flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:10px 12px;font-size:13.5px;outline:none;
  }
  .instruction-bar input:focus{border-color:var(--accent);}

  aside.right{
    border-left:1px solid var(--line);
    padding:16px 14px;
    overflow-y:auto;
    background:var(--panel);
  }
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .seg-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg-toggle button{
    flex:1;background:var(--panel-2);border:none;color:var(--text-dim);padding:8px 0;font-size:12.5px;cursor:pointer;
  }
  .seg-toggle button.active{background:var(--accent);color:#fff;}
  .switch-row{display:flex;align-items:center;justify-content:space-between;}
  .switch{
    width:38px;height:22px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);
    position:relative;cursor:pointer;flex:none;
  }
  .switch.on{background:var(--accent);border-color:var(--accent);}
  .switch::after{
    content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:#fff;transition:.15s;
  }
  .switch.on::after{left:18px;}
  input[type="range"]{width:100%;}
  .range-val{font-size:12px;color:var(--text-dim);text-align:right;}

  .overlay{
    position:fixed;inset:0;background:rgba(8,9,13,.72);backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;z-index:50;
  }
  .overlay.show{display:flex;}
  .progress-card{
    width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;
    text-align:center;
  }
  .spinner{
    width:36px;height:36px;border-radius:50%;
    border:3px solid var(--line);border-top-color:var(--accent);
    margin:0 auto 16px;animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .stage-name{font-size:14px;font-weight:600;margin-bottom:4px;}
  .stage-sub{font-size:12px;color:var(--text-dim);margin-bottom:14px;}
  .pbar{height:6px;border-radius:4px;background:var(--panel-2);overflow:hidden;}
  .pbar > div{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s ease;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--good);color:var(--text);
    padding:12px 20px;border-radius:10px;font-size:13px;
    opacity:0;transition:.25s;display:flex;align-items:center;gap:8px;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast .dot{width:8px;height:8px;border-radius:50%;background:var(--good);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="mark">AE</span>AI-Editer</div>
    <div class="header-right">
      <button class="btn ghost" id="fullscreenBtn" title="全画面表示に切り替えます">全画面</button>
      <button class="btn" id="exportBtn" disabled>書き出し</button>
    </div>
  </header>

  <aside class="left">
    <div class="section-title">素材</div>
    <div class="drop" id="dropZone">
      動画をドラッグ＆ドロップ<br />またはクリックして選択
      <input type="file" id="fileInput" accept="video/*" hidden />
    </div>
    <div class="clip-list" id="clipList"></div>
  </aside>

  <main class="center">
    <div class="stage v-landscape" id="stage">
      <div class="empty" id="stageEmpty"><b>素材が選択されていません</b>左の枠から動画を追加してください</div>
      <video id="player" playsinline controls style="display:none;"></video>
    </div>

    <div class="timeline-wrap">
      <div class="timeline-head">
        <span class="label">タイムライン</span>
        <span class="label" id="timelineStatus">未処理</span>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>

    <div class="instruction-bar">
      <input id="instructionInput" type="text" placeholder="指示を入力（例：1分半のダイジェストで／NGと雑談は落として）" />
      <button class="btn primary" id="runBtn">実行</button>
    </div>
  </main>

  <aside class="right">
    <div class="field">
      <label>縦横比</label>
      <div class="seg-toggle">
        <button class="active" data-aspect="landscape">横（16:9）</button>
        <button data-aspect="portrait">縦（9:16）</button>
      </div>
    </div>

    <div class="field">
      <div class="switch-row">
        <label style="margin:0;">字幕を付ける</label>
        <div class="switch on" id="captionSwitch"></div>
      </div>
    </div>

    <div class="field">
      <label>目標の尺</label>
      <input type="range" id="durationRange" min="15" max="180" value="90" step="5" />
      <div class="range-val" id="durationVal">1分30秒</div>
    </div>

    <div class="field">
      <label>出力本数</label>
      <div class="seg-toggle">
        <button class="active" data-count="1">1本</button>
        <button data-count="3">3本</button>
        <button data-count="5">5本</button>
      </div>
    </div>
  </aside>
</div>

<div class="overlay" id="overlay">
  <div class="progress-card">
    <div class="spinner"></div>
    <div class="stage-name" id="stageName">文字起こし</div>
    <div class="stage-sub" id="stageSub">音声を解析しています</div>
    <div class="pbar"><div id="pbarFill"></div></div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastText">完了しました</span></div>

<script>
(() => {
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const clipList = document.getElementById('clipList');
  const stage = document.getElementById('stage');
  const stageEmpty = document.getElementById('stageEmpty');
  const player = document.getElementById('player');
  const timeline = document.getElementById('timeline');
  const timelineStatus = document.getElementById('timelineStatus');
  const runBtn = document.getElementById('runBtn');
  const exportBtn = document.getElementById('exportBtn');
  const overlay = document.getElementById('overlay');
  const stageName = document.getElementById('stageName');
  const stageSub = document.getElementById('stageSub');
  const pbarFill = document.getElementById('pbarFill');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  const durationRange = document.getElementById('durationRange');
  const durationVal = document.getElementById('durationVal');
  const captionSwitch = document.getElementById('captionSwitch');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  let clips = [];
  let activeClip = null;

  // --- 素材の追加 ---
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', () => handleFiles(fileInput.files));

  function handleFiles(fileList) {
    [...fileList].filter(f => f.type.startsWith('video/')).forEach(addClip);
  }

  function addClip(file) {
    const url = URL.createObjectURL(file);
    const clip = { id: crypto.randomUUID(), file, url, name: file.name, duration: null };
    clips.push(clip);
    renderClipList();
    selectClip(clip);
    // サムネ生成用に一度読み込む
    const tmp = document.createElement('video');
    tmp.src = url;
    tmp.muted = true;
    tmp.addEventListener('loadedmetadata', () => {
      clip.duration = tmp.duration;
      tmp.currentTime = Math.min(1, tmp.duration / 2);
    });
    tmp.addEventListener('seeked', () => {
      const canvas = document.querySelector(`canvas[data-clip="${clip.id}"]`);
      if (canvas) {
        const ctx = canvas.getContext('2d');
        canvas.width = 104; canvas.height = 64;
        ctx.drawImage(tmp, 0, 0, canvas.width, canvas.height);
      }
      renderClipList();
    }, { once: true });
  }

  function fmtDur(sec) {
    if (!sec && sec !== 0) return '--:--';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function renderClipList() {
    clipList.innerHTML = '';
    clips.forEach(clip => {
      const card = document.createElement('div');
      card.className = 'clip-card' + (activeClip && activeClip.id === clip.id ? ' active' : '');
      card.innerHTML = `<canvas data-clip="${clip.id}"></canvas>
        <div class="clip-meta">
          <div class="name">${escapeHtml(clip.name)}</div>
          <div class="dur">${fmtDur(clip.duration)}</div>
        </div>`;
      card.addEventListener('click', () => selectClip(clip));
      clipList.appendChild(card);
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function selectClip(clip) {
    activeClip = clip;
    player.src = clip.url;
    player.style.display = 'block';
    stageEmpty.style.display = 'none';
    resetTimeline();
    renderClipList();
  }

  function resetTimeline() {
    timeline.innerHTML = '';
    timelineStatus.textContent = '未処理';
    exportBtn.disabled = true;
  }

  // --- 縦横比 ---
  document.querySelectorAll('[data-aspect]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-aspect]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      stage.classList.toggle('v-portrait', btn.dataset.aspect === 'portrait');
      stage.classList.toggle('v-landscape', btn.dataset.aspect === 'landscape');
    });
  });

  document.querySelectorAll('[data-count]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-count]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  captionSwitch.addEventListener('click', () => captionSwitch.classList.toggle('on'));

  durationRange.addEventListener('input', () => {
    const v = Number(durationRange.value);
    const m = Math.floor(v / 60), s = v % 60;
    durationVal.textContent = m > 0 ? `${m}分${s ? s + '秒' : ''}` : `${s}秒`;
  });

  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  });

  // --- 実行（見た目のみ） ---
  const stages = [
    { name: '文字起こし', sub: '音声を解析しています' },
    { name: '区間選定', sub: '指示に合う区間を選んでいます' },
    { name: '書き出し準備', sub: 'タイムラインを組み立てています' },
  ];

  runBtn.addEventListener('click', () => {
    if (!activeClip) { addShakeHint(dropZone); return; }
    overlay.classList.add('show');
    let i = 0;
    const totalSteps = stages.length;
    const stepTime = 1100;

    function step() {
      const s = stages[i];
      stageName.textContent = s.name;
      stageSub.textContent = s.sub;
      pbarFill.style.width = `${Math.round(((i + 1) / totalSteps) * 100)}%`;
      i++;
      if (i < totalSteps) {
        setTimeout(step, stepTime);
      } else {
        setTimeout(finish, stepTime);
      }
    }
    pbarFill.style.width = '0%';
    setTimeout(step, 150);

    function finish() {
      overlay.classList.remove('show');
      renderResultTimeline();
      timelineStatus.textContent = '処理済み';
      exportBtn.disabled = false;
      showToast('区間の選定が完了しました');
    }
  });

  function renderResultTimeline() {
    timeline.innerHTML = '';
    const dur = activeClip.duration || 60;
    // duration を種にした決定的な区間割り（本物の解析ではなく表示用）
    let seed = Math.floor(dur * 97) % 1000;
    const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const segCount = 8 + Math.floor(rand() * 4);
    let remaining = 100;
    for (let i = 0; i < segCount; i++) {
      const isLast = i === segCount - 1;
      const pct = isLast ? remaining : Math.max(4, Math.round(rand() * (remaining / (segCount - i)) * 1.6));
      remaining -= pct;
      const keep = rand() > 0.35;
      const seg = document.createElement('div');
      seg.className = 'seg ' + (keep ? 'keep' : 'cut');
      seg.style.width = Math.max(pct, 2) + '%';
      seg.title = keep ? '残す区間' : 'カットする区間';
      timeline.appendChild(seg);
    }
  }

  exportBtn.addEventListener('click', () => {
    showToast('書き出しが完了しました');
  });

  let toastTimer = null;
  function showToast(text) {
    toastText.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  function addShakeHint(el) {
    el.style.borderColor = 'var(--warn)';
    setTimeout(() => { el.style.borderColor = ''; }, 700);
  }

  durationRange.dispatchEvent(new Event('input'));
})();
</script>
</body>
</html>
