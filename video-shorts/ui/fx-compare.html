<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>エフェクト比較 — 派手なの3つ</title>
  <link rel="stylesheet" href="fx-compare.css" />
</head>
<body>
  <header class="bar">
    <h1>派手エフェクト 3種 比較</h1>
    <p class="hint">素材: #1「二度追いついた執念」／ 全て FFmpeg標準・CPU・無料。クリックで再生・音あり。</p>
  </header>

  <main class="row">
    <figure class="cell">
      <figcaption><span class="num">①</span> 色収差グリッチ</figcaption>
      <video src="fx-1-glitch.mp4" controls loop playsinline preload="metadata"></video>
      <p class="desc">RGBずらし＋ノイズ＋彩度爆上げ。デジタルバグ風</p>
    </figure>
    <figure class="cell">
      <figcaption><span class="num">②</span> ネオングロー</figcaption>
      <video src="fx-2-neon.mp4" controls loop playsinline preload="metadata"></video>
      <p class="desc">発光合成＋彩度2倍＋色相が時間で回転。極彩色</p>
    </figure>
    <figure class="cell">
      <figcaption><span class="num">③</span> ズームシェイク</figcaption>
      <video src="fx-3-shake.mp4" controls loop playsinline preload="metadata"></video>
      <p class="desc">1.1倍ズーム＋カメラ揺れ。手持ち感・勢い</p>
    </figure>
  </main>
</body>
</html>
