  - list [ref=e10]:
    - listitem [ref=e11]:
      - heading "AI の出力と確認責任 第13条" [level=2] [ref=e12]:
        - text: AI の出力と確認責任
        - generic [ref=e13]: 第13条
      - paragraph [ref=e14]:
        - text: AI（特に生成AI）は、その特性上、誤情報・ハルシネーション・第三者の権利侵害の可能性を完全には排除できません。AI生成物は判断を補助する参考情報であり、採用・対外利用の最終判断はお客様の責任で行い、内容の正確性・適法性・第三者権利の非侵害はお客様が確認します。確認を経て利用した結果生じた損害について、乙に故意・重過失があるときを除き乙は責任を負いません。医療・法律・税務・会計等の専門判断は有資格者にご相談ください。
        - text: ※ただし成果物の計算ロジック等の基本機能の正確性は、確認責任を理由に免責されず、乙が第11条により責任を負います。
    - listitem [ref=e15]:
      - heading "外部サービス・AI提供者側の不備 第14条" [level=2] [ref=e16]:
        - text: 外部サービス・AI提供者側の不備
        - generic [ref=e17]: 第14条
      - paragraph [ref=e18]: 外部サービス又はAI提供者の側に存する不備・脆弱性・誤作動に起因して生じた損害について、本同意書の作成日に既に公表され又は乙が知り得たものを除き、乙は責任を負いません（乙の故意・重過失を除く）。
    - listitem [ref=e19]:
      - heading "料金はお客様負担・お客様名義 第3条3項" [level=2] [ref=e20]:
        - text: 料金はお客様負担・お客様名義
        - generic [ref=e21]: 第3条3項
      - paragraph [ref=e22]:
        - text: 文字起こし高速化(Groq)その他 AIサービスの利用料及び実費はお客様のご負担です。AIサービスの利用契約は、別段の合意がない限り、お客様の名義及び負担で締結します。
        - strong [ref=e23]: 鍵（APIキー）はお客様のものであり、kosespark は預かりません・保存しません。
        - text: 鍵を設定しなければ無料のローカル処理で動作します。
    - listitem [ref=e24]:
      - heading "データ・生成AIへの情報入力 第16条" [level=2] [ref=e25]:
        - text: データ・生成AIへの情報入力
        - generic [ref=e26]: 第16条
      - paragraph [ref=e27]: 動画・音声・文字起こしはお客様の PC 内で処理されます。Groq を使う場合のみ、音声はお客様の鍵で Groq に送信されます（Groq の規約に従います）。学習に利用される設定のAIに、秘密情報・個人情報を入力しないようご注意ください。お客様が自ら入力したことに起因する損害について、乙は責任を負いません。
    - listitem [ref=e28]:
      - heading "成果の無保証 第2条2項" [level=2] [ref=e29]:
        - text: 成果の無保証
        - generic [ref=e30]: 第2条2項
      - paragraph [ref=e31]: 本ツール及び助言は事務の遂行を目的とし、売上の向上・コストの削減その他の具体的成果を保証しません。文字起こし精度・区間選定の品質・出力画質・処理速度は、素材及び利用環境に依存します。
    - listitem [ref=e32]:
      - heading "仕様変更・環境変化・法令改正 第9条・第19条の2" [level=2] [ref=e33]:
        - text: 仕様変更・環境変化・法令改正
        - generic [ref=e34]: 第9条・第19条の2
      - paragraph [ref=e35]: 外部サービスの仕様変更・提供終了、OS・ブラウザ・端末等の環境変化、法令・税率等の改正に起因して正常に動作しない場合、これは瑕疵・契約不適合に該当しません。対応が必要な場合は、別途お見積りのうえ有償の改修となります。乙はこれらを常時監視する義務を負いません。
    - listitem [ref=e36]:
      - heading "検収・不具合・保守 第10〜12条" [level=2] [ref=e37]:
        - text: 検収・不具合・保守
        - generic [ref=e38]: 第10〜12条
      - paragraph [ref=e39]: 合意した受入基準（別紙D）を再現できない不具合の修補は、契約不適合責任及び保守の範囲に含まれます。使い心地の改善・新機能の追加は、これに含まれず別途有償です。保守は別紙1「保守契約書」により行い、稼働率の保証・復旧時間の保証は行いません。
    - listitem [ref=e40]:
      - heading "損害賠償の範囲・上限 第19条" [level=2] [ref=e41]:
        - text: 損害賠償の範囲・上限
        - generic [ref=e42]: 第19条
      - paragraph [ref=e43]: 賠償は相手方に現実に生じた通常の損害に限り、逸失利益・間接損害・特別損害・事業機会の喪失を含みません。賠償額は、原因事由の発生時から遡って6か月間にお客様が乙に支払った顧問料（保守料を含む）の総額を上限とします（故意・重過失を除く）。お客様の顧客その他第三者への対応費用は、賠償の範囲に含まれません。
