      - listitem [ref=f1e71]:
        - generic [ref=f1e72]: 区間選定
        - text: （AI が見どころを選ぶ）：
        - generic [ref=f1e73]: node pipeline.mjs select work/myvideo
      - listitem [ref=f1e74]:
        - generic [ref=f1e75]: レンダリング
