    - paragraph [ref=f1e101]: ショートは「候補」として複数作られます。ui/index.html をブラウザで開き、良いものだけを採用してください。すべてを自動採用にはせず、必ず目で見て選びます（見どころの歩留まりは 30〜50% が目安です）。
