  - generic [ref=f1e51]:
    - heading "2. 初回セットアップ" [level=2] [ref=f1e52]
    - list [ref=f1e53]:
      - listitem [ref=f1e54]:
        - generic [ref=f1e55]: 同意
        - text: ：consent.html を開いて同意（上記 0）。
      - listitem [ref=f1e56]:
        - generic [ref=f1e57]: 文字起こしライブラリを入れる
        - text: （無料）：
        - generic [ref=f1e58]: pip install -r requirements.txt
      - listitem [ref=f1e59]:
        - generic [ref=f1e60]: （任意）高速文字起こしを使う場合だけ
        - text: ：あなたの Groq アカウントで鍵を作り、video-shorts/.env に1行だけ書きます。鍵はこのファイル以外に貼らないでください。
        - generic [ref=f1e61]: GROQ_API_KEY=gsk_（console.groq.com/keys で作成した鍵）
        - text: 鍵が有効か確認：
        - generic [ref=f1e62]: python src/check-groq-key.py
        - paragraph [ref=f1e63]: 鍵を設定しなくても、無効でも、ネットが切れても、自動で無料のローカル文字起こしに切り替わるので止まりません。
