  - generic [ref=f1e124]:
    - heading "7. よくある質問" [level=2] [ref=f1e125]
    - generic [ref=f1e126]:
      - term [ref=f1e127]: 動画は外部に送られますか？
      - definition [ref=f1e128]: いいえ。処理は PC 内で行われます。高速文字起こし（Groq）を使うときだけ、音声があなたの鍵で Groq に送られます。
      - term [ref=f1e129]: お金はかかりますか？
      - definition [ref=f1e130]: ツールはローカルで無料動作します。Groq を使い無料枠を超えた分だけ、あなたの Groq アカウントに課金されます（鍵を設定しなければ無料）。
      - term [ref=f1e131]: 字幕の変換ミスが気になります。
      - definition [ref=f1e132]: 用語辞書（src/term-corrections.json）に「誤→正」を登録すると、次回の文字起こしから直ります。
