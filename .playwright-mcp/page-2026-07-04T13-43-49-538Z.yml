    - heading "1. AIの出力と確認責任 第13条" [level=2] [ref=e16]
    - paragraph [ref=e17]: AI（特に生成AI）は誤情報・ハルシネーション・第三者権利侵害の可能性を完全には排除できません。AI生成物は判断を補助する参考情報であり、採用・対外利用の最終判断はお客様の責任で行い、正確性・適法性・第三者権利の非侵害はお客様が確認します。確認を経て利用した結果生じた損害について、乙に故意・重過失があるときを除き乙は責任を負いません。医療・法律・税務・会計等の専門判断は有資格者にご相談ください。ただし成果物の計算ロジック等の基本機能の正確性は乙が第11条により責任を負います。
    - heading "2. 外部サービス・AI提供者側の不備 第14条" [level=2] [ref=e18]
    - paragraph [ref=e19]: 外部サービス又はAI提供者側の不備・脆弱性・誤作動に起因する損害について、本規約作成日に既に公表され又は乙が知り得たものを除き、乙は責任を負いません（乙の故意・重過失を除く）。
    - heading "3. 料金はお客様負担・お客様名義 第3条3項" [level=2] [ref=e20]
    - paragraph [ref=e21]: 文字起こし高速化(Groq)その他 AIサービスの利用料及び実費はお客様のご負担です。AIサービスの利用契約はお客様の名義・負担で締結します。鍵（APIキー）はお客様のもので、kosespark は預かりません・保存しません。鍵を設定しなければ無料のローカル処理で動作します。
    - heading "4. データ・生成AIへの情報入力 第16条" [level=2] [ref=e22]
    - paragraph [ref=e23]: 動画・音声・文字起こしはお客様のPC内で処理されます。Groq を使う場合のみ音声がお客様の鍵で Groq に送信されます。学習に利用される設定のAIに秘密情報・個人情報を入力しないようご注意ください。お客様が入力したことに起因する損害について乙は責任を負いません。
    - heading "5. 成果の無保証 第2条2項" [level=2] [ref=e24]
    - paragraph [ref=e25]: 本ツール及び助言は事務の遂行を目的とし、売上向上・コスト削減その他の具体的成果を保証しません。文字起こし精度・区間選定の品質・出力画質・処理速度は素材及び利用環境に依存します。
    - heading "6. 仕様変更・環境変化・法令改正 第9条・第19条の2" [level=2] [ref=e26]
    - paragraph [ref=e27]: 外部サービスの仕様変更・提供終了、OS・ブラウザ・端末の変化、法令・税率の改正に起因する不動作は瑕疵・契約不適合に該当しません。対応が必要な場合は別途見積りのうえ有償改修となります。
    - heading "7. 検収・不具合・保守 第10〜12条" [level=2] [ref=e28]
    - paragraph [ref=e29]: 合意した受入基準を再現できない不具合の修補は契約不適合責任・保守の範囲。使い心地の改善・新機能は別途有償。保守は別紙1により行い、稼働率・復旧時間の保証は行いません。
    - heading "8. 損害賠償の範囲・上限 第19条" [level=2] [ref=e30]
    - paragraph [ref=e31]: 賠償は現実に生じた通常の損害に限り、逸失利益・間接損害・特別損害を含みません。賠償額は原因発生時から遡り6か月間に支払われた顧問料（保守料含む）の総額を上限とします（故意・重過失を除く）。お客様の顧客等第三者への対応費用は含みません。本規約と AI顧問契約書 に齟齬があるときは顧問契約書が優先します。
