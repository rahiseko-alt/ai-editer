name: CI

# 機械の審判（machine judge）。ロードマップ G-1 系の evidence は
# このワークフローの run URL / commit SHA を指す（AI の自己申告を証拠にしない）。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: typecheck / lint / test / build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Lint
        run: pnpm -r --if-present lint

      # ランナーイメージ同梱の python3 に依存すると、GitHub がイメージを更新した際に
      # リポジトリ側の変更なしに ci-green(必須チェック)が壊れうる。版を固定する。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # M-4-F/M-4-G のテストは、実際に動画ファイルを作って出力に顔検出を掛け直す。
      # 「関数が正しい値を返す」ではなく「成果物が正しい」まで確かめるため ffmpeg が要る。
      # 入っていないからテストを飛ばす、は AGENTS.md が禁じる「偽の緑」なので入れる。
      # zip は G-SLIM S-1（軽い配布物が30MB以内）で、客が受け取るのと同じ形に固めて測るのに使う。
      # ランナー同梱に頼ると、イメージ更新でリポジトリ側の変更なしに必須チェックが壊れうるため明示導入する。
      - name: Install ffmpeg / zip (成果物まで検証するテストで使う)
        run: |
          sudo apt-get update -qq
          # roadmap P1-12「外部ツールのバージョン固定」: ubuntu-24.04 の apt で
          # 実際に配布されている版番号を明示指定する(無指定だとミラー側の更新で
          # 黙って違う版が入りうる)。版が更新されて入手不能になったら、CIが赤くなって
          # 気づける状態が意図どおり(黙って新版へドリフトしない)。
          sudo apt-get install -y -qq ffmpeg=7:6.1.1-3ubuntu5 zip=3.0-13ubuntu0.2
          # ランナーを ubuntu-24.04 に固定してあるので、apt が入れる ffmpeg も
          # そのリリースのもの(6.1.1)に定まる。G-EDIT-MOSAIC-UI-C の合格ライン
          # (ノイズの床＝5)はこの版で実測した値なので、実際に使われた版を記録に残す。
          ffmpeg -version | head -1
          zip --version | head -2 | tail -1

      # 顔モザイクのテスト(tests/face-mosaic-check.py)が cv2 を使う。
      # requirements.txt 全体は文字起こしの重い依存を含み CI では不要なので opencv だけを入れる。
      # 版の指定は requirements.txt を唯一の正とし、そこから抜き出して使う(二重管理で食い違わせない)。
      # 入れずにテストをスキップさせるのは AGENTS.md が禁じる「偽の緑」にあたるため行わない。
      - name: Install Python deps for face tests (opencv only)
        run: |
          spec=$(grep -E '^opencv-python-headless' video-shorts/requirements.txt)
          if [ -z "$spec" ]; then
            echo "FAIL: opencv-python-headless が video-shorts/requirements.txt に見つかりません"
            exit 1
          fi
          echo "installing: $spec"
          python -m pip install "$spec"

      # P2-5/7/8（webapp-mockup の実ブラウザ検証）が playwright を使う。devDependencies を
      # `pnpm install` が既に入れているので、ここでは実行に要る Chromium バイナリだけを取得する。
      - name: Install Playwright Chromium
        run: pnpm --filter video-shorts exec playwright install --with-deps chromium

      # マスター決定(D-2, 2026-08-11): G-EDIT-CAPTION-B の確かめ方を「文字認識ツール
      # (tesseract-ocr)を入れて実際に読ませる」へ変更。字幕は日本語なので日本語言語パック
      # (tesseract-ocr-jpn)も入れる。版は P1-12 と同じ考え方で実際に配布されている番号を
      # 明示指定する(無指定だとミラー側の更新で黙って違う版が入りうるため)。
      - name: Install tesseract-ocr (G-EDIT-CAPTION-B の実フレームOCR検証で使う)
        run: |
          sudo apt-get install -y -qq tesseract-ocr=5.3.4-1build5 tesseract-ocr-jpn=1:4.1.0-2
          tesseract --version | head -1
          tesseract --list-langs

      # マスター決定(D-3, 2026-08-11): G-EDIT-CAPTION-D の通し確認を「音声認識モデルを置いて
      # 実際に認識させる」へ変更。faster-whisper のモデル本体(Hugging Face Hub から取得)は
      # 数百MBあり毎回取得すると重いので、キャッシュして初回のみダウンロードにする。
      # キーは requirements.txt のハッシュを含める(faster-whisper の版が変わったらモデルの
      # 保存形式も変わりうるため、古いキャッシュを使い回さない)。
      - name: Cache faster-whisper model (small)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-faster-whisper-small-${{ hashFiles('video-shorts/requirements.txt') }}-v1

      - name: Install faster-whisper (D-3の通し確認で実モデルを動かすのに使う)
        run: |
          spec=$(grep -E '^faster-whisper==' video-shorts/requirements.txt)
          if [ -z "$spec" ]; then
            echo "FAIL: faster-whisper が video-shorts/requirements.txt に見つかりません"
            exit 1
          fi
          echo "installing: $spec"
          python -m pip install "$spec"

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r --if-present build

      - name: Audit (fail on moderate+)
        run: pnpm audit --audit-level moderate

      - name: Verify roadmap evidence (外部事実のみ)
        run: node scripts/verify-roadmap-evidence.mjs

  smoke:
    name: 起動スモーク (start → curl 200 + marker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # 到達性を外部事実(HTTP 200＋本文マーカー)で縛る。スクショにしない。
      - name: Smoke (video-shorts server start → curl 200 + 'AI-Editer')
        run: |
          node video-shorts/server/index.mjs &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          # 起動待ち（最大60秒）
          ready=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5178 || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "FAIL: server did not return 200 within timeout (last code: ${code:-none})"
            exit 1
          fi

          # 本文に既知マーカーを含むこと
          body=$(curl -sf http://127.0.0.1:5178)
          if ! printf '%s' "$body" | grep -q 'AI-Editer'; then
            echo "FAIL: body did not contain marker 'AI-Editer'"
            exit 1
          fi

          echo "SMOKE OK: HTTP 200 かつ本文に 'AI-Editer' を確認"

  hook-session-start:
    name: session-startフック (G-DELIVERY-HOOK-*) の実地検証
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: ローカル扱い(CLAUDE_CODE_REMOTE未設定)は無音no-op
        run: |
          out=$(env -u CLAUDE_CODE_REMOTE .claude/hooks/session-start.sh 2>&1)
          if [ -n "$out" ]; then
            echo "FAIL: local run should print nothing (got: $out)"
            exit 1
          fi
          echo "OK: local run is a silent no-op"

      - name: 実地検証のため既存のffmpeg/文字起こしライブラリを一旦除去
        run: |
          sudo apt-get remove -y ffmpeg
          python3 -m pip uninstall -y --break-system-packages faster-whisper groq || true

      - name: クラウド扱い(CLAUDE_CODE_REMOTE=true)でffmpegと文字起こしライブラリが自動導入される
        run: |
          CLAUDE_CODE_REMOTE=true CLAUDE_PROJECT_DIR="$PWD" .claude/hooks/session-start.sh
          ffmpeg -version
          python3 -c "import faster_whisper, groq"

  # 集約ゲート＝branch protection が要求する「安定した1つの必須チェック」。
  # 内部ジョブ(quality/smoke)の名前や中身が変わっても context 名は 'ci-green' で不変。
  # scripts/setup.sh はこの 'ci-green' と 'roadmap-required' だけを必須指定する。
  gate:
    name: ci-green
    needs: [quality, smoke, hook-session-start]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 上流ジョブが全て success か検査（1つでも失敗/スキップなら赤）
        # ジョブID(hook-session-start)にハイフンを含むため、式では needs.hook-session-start
        # のドット記法は使えない(ハイフンが減算と解釈され式が壊れる)。needs['...'] の
        # ブラケット記法を使う。
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.smoke.result }}" != "success" ] || [ "${{ needs['hook-session-start'].result }}" != "success" ]; then
            echo "ci-green: FAIL (quality=${{ needs.quality.result }} smoke=${{ needs.smoke.result }} hook-session-start=${{ needs['hook-session-start'].result }})"
            exit 1
          fi
          echo "ci-green: OK（quality / smoke / hook-session-start ともに success）"
