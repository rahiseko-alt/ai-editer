name: CI

# 機械の審判（machine judge）。ロードマップ G-1 系の evidence は
# このワークフローの run URL / commit SHA を指す（AI の自己申告を証拠にしない）。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Lint
        run: pnpm -r --if-present lint

      # 顔モザイクのテスト(tests/face-mosaic-check.py)が cv2 を使う。
      # requirements.txt 全体は文字起こしの重い依存を含み CI では不要なので、
      # ここでは opencv だけを入れる。入れずにテストをスキップさせるのは
      # AGENTS.md が禁じる「偽の緑」にあたるため行わない。
      - name: Install Python deps for face tests (opencv only)
        run: python3 -m pip install --break-system-packages 'opencv-python-headless>=4.9.0'

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r --if-present build

      - name: Audit (fail on moderate+)
        run: pnpm audit --audit-level moderate

      - name: Verify roadmap evidence (外部事実のみ)
        run: node scripts/verify-roadmap-evidence.mjs

  smoke:
    name: 起動スモーク (start → curl 200 + marker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # 到達性を外部事実(HTTP 200＋本文マーカー)で縛る。スクショにしない。
      - name: Smoke (video-shorts server start → curl 200 + 'kosespark')
        run: |
          node video-shorts/server/index.mjs &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          # 起動待ち（最大60秒）
          ready=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5178 || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "FAIL: server did not return 200 within timeout (last code: ${code:-none})"
            exit 1
          fi

          # 本文に既知マーカーを含むこと
          body=$(curl -sf http://127.0.0.1:5178)
          if ! printf '%s' "$body" | grep -q 'kosespark'; then
            echo "FAIL: body did not contain marker 'kosespark'"
            exit 1
          fi

          echo "SMOKE OK: HTTP 200 かつ本文に 'kosespark' を確認"

  hook-session-start:
    name: session-startフック (G-DELIVERY-HOOK-*) の実地検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ローカル扱い(CLAUDE_CODE_REMOTE未設定)は無音no-op
        run: |
          out=$(env -u CLAUDE_CODE_REMOTE .claude/hooks/session-start.sh 2>&1)
          if [ -n "$out" ]; then
            echo "FAIL: local run should print nothing (got: $out)"
            exit 1
          fi
          echo "OK: local run is a silent no-op"

      - name: 実地検証のため既存のffmpeg/文字起こしライブラリを一旦除去
        run: |
          sudo apt-get remove -y ffmpeg
          python3 -m pip uninstall -y --break-system-packages faster-whisper groq || true

      - name: クラウド扱い(CLAUDE_CODE_REMOTE=true)でffmpegと文字起こしライブラリが自動導入される
        run: |
          CLAUDE_CODE_REMOTE=true CLAUDE_PROJECT_DIR="$PWD" .claude/hooks/session-start.sh
          ffmpeg -version
          python3 -c "import faster_whisper, groq"

  # 集約ゲート＝branch protection が要求する「安定した1つの必須チェック」。
  # 内部ジョブ(quality/smoke)の名前や中身が変わっても context 名は 'ci-green' で不変。
  # scripts/setup.sh はこの 'ci-green' と 'roadmap-required' だけを必須指定する。
  gate:
    name: ci-green
    needs: [quality, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 上流ジョブが全て success か検査（1つでも失敗/スキップなら赤）
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.smoke.result }}" != "success" ]; then
            echo "ci-green: FAIL (quality=${{ needs.quality.result }} smoke=${{ needs.smoke.result }})"
            exit 1
          fi
          echo "ci-green: OK（quality / smoke ともに success）"
