name: roadmap-required

# ロードマップ必須ゲート。全PRは docs/roadmap.html を必ず更新する。
# handoff（meta.handoff）を roadmap に同梱したので、これで「引継ぎが本編に必ず乗る」を機械保証する。
# ②今回トラブル・③次回=meta.next は毎セッション必ず書けるため diff 0 はあり得ない＝例外なし。
# ※ 機械強制は branch protection で status context `roadmap-required` を必須にして初めて有効。

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  require-roadmap:
    name: roadmap-required
    # ubuntu-24.04固定（ubuntu-latestは浮動ラベル。verify-done-gate.mjsがffmpeg実機を使う
    # verifyCmdを実行しうるため、qualityジョブと同じ固定イメージにして測定条件を揃える）。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: docs/roadmap.html の差分を確認
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE...$HEAD" | grep -qx 'docs/roadmap.html'; then
            echo "OK: docs/roadmap.html に差分あり。"
          else
            echo "NG: このPRは docs/roadmap.html を更新していません。"
            echo "毎セッション、最低でも meta.handoff（①今回実施 ②今回トラブル ③次回=meta.next）を更新すること。例外なし。"
            exit 1
          fi
      # 2026-08-09の事故（凍結済み葉のcriteria.textを実装担当が書き換えて「達成」と報告）を
      # 機械で検知するゲート。BASE/HEADのdocs/roadmap.htmlを比較し、status!=="todo"（凍結済み）の
      # 葉のcriteria/verify/verifyCmd本文が、正当な宣言(meta.basisChanges)なしに変わっていないか、
      # 本文を書き換えずに削除・凍結解除で基準を骨抜きにしていないかを見る。
      - name: 凍結済みcriteria/verify/verifyCmdの無断変更・削除・凍結解除を検査
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify-criteria-freeze.mjs

      # 2026-08-10 マスター指示「最初に決めたハードルを、AIが下げるのを機械ブロックさせろ」を
      # 裏付けるゲート。CI緑・criteria凍結だけでは「実装者が自分で書いたテストに自分の実装が
      # 通った」という自己申告の域を出ないため、今回のPRで新規に done へ遷移した葉については、
      # 凍結済みの verifyCmd を今この場で実際に実行し、exit code 0 になることを機械で要求する。
      #
      # verifyCmd の実行には（video-shorts配下のテストを想定する場合）pnpm install / ffmpeg /
      # opencv 等が要ることがあるため、quality ジョブの環境構築を最小限ここでも用意する。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (verifyCmdが実機ffmpegを使う場合に備える。版はquality同様ubuntu-24.04固定)
        run: |
          sudo apt-get update -qq
          # AUD-P2-19: ci.yml / measure-leak-rate.yml と同じ版を明示指定する(無指定だと
          # ミラー側の更新で黙って違う版が入りうる。external-tool-version-pin-check.mjs が
          # .github/workflows/ 配下を再帰的に検査してこの無指定を検知する)。
          sudo apt-get install -y -qq ffmpeg=7:6.1.1-3ubuntu5
      - name: Install opencv (verifyCmdが顔検出系テストを使う場合に備える)
        run: |
          spec=$(grep -E '^opencv-python-headless' video-shorts/requirements.txt)
          python -m pip install "$spec"
      - name: Install Playwright Chromium (verifyCmdが実ブラウザ検証テストを使う場合に備える)
        run: pnpm --filter video-shorts exec playwright install --with-deps chromium
      # マスター決定(D-2, 2026-08-11)。ci.yml の quality ジョブと同じ手順（版を明示指定）。
      # roadmap-required は verifyCmd を実際に実行するため、quality 側だけに入れても
      # ここで tesseract が無ければ G-EDIT-CAPTION-B の verifyCmd がここでは失敗する
      # （2026-08-11 実際に発生：PR #90 で roadmap-required のみ失敗）。
      - name: Install tesseract-ocr (verifyCmdがG-EDIT-CAPTION-BのOCR検証を使う場合に備える)
        run: |
          sudo apt-get install -y -qq tesseract-ocr=5.3.4-1build5 tesseract-ocr-jpn=1:4.1.0-2
          tesseract --version | head -1
          tesseract --list-langs
      # マスター決定(D-3, 2026-08-11)。ci.yml の quality ジョブと同じ理由でここにも要る。
      - name: Cache faster-whisper model (small)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-faster-whisper-small-${{ hashFiles('video-shorts/requirements.txt') }}-v1
      - name: Install faster-whisper (verifyCmdがG-EDIT-CAPTION-Dの実モデル検証を使う場合に備える)
        run: |
          spec=$(grep -E '^faster-whisper==' video-shorts/requirements.txt)
          if [ -z "$spec" ]; then
            echo "FAIL: faster-whisper が video-shorts/requirements.txt に見つかりません"
            exit 1
          fi
          echo "installing: $spec"
          python -m pip install "$spec"
      - name: done化する葉のverifyCmdを実際に実行して合否を判定
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify-done-gate.mjs
