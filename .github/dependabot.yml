version: 2
updates:
  # pnpm workspace（apps/*, packages/*）はロックファイルがルート1つなので "/" 指定で全体をカバーする
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
